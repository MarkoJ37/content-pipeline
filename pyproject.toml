[project]
name = "content-pipeline"
version = "0.1.0"
description = "Automated Instagram content pipeline (curate + generate)"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    "pillow",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the ASS subtitle header is a fixed file format; its lines cannot wrap
"src/generate/assemble.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that need real models/binaries (deselect with '-m \"not integration\"')",
]
