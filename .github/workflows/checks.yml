name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install pytest ruff pillow
      - run: python -m pytest -m "not integration" -q
      - run: python -m ruff check src scripts tests
      - run: node --test tests/frontend.test.cjs
